<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in – JOBNEX</title>
<link rel="stylesheet" href="common.css">
</head>
<body data-page="login">
<main class="login-wrap" id="main">
  <section class="hero" aria-label="Welcome">
    <h1>JOB<span>NEX</span></h1>
    <p>See how well your resume fits a job description, find roles, prepare for interviews and track every application.</p>
  </section>
  <section class="card login-card" aria-labelledby="login-heading">
    <h2 id="login-heading">Log in</h2>
    <p id="demo-note" class="note">Demo mode: no real authentication is connected. Any valid email and a password of 8+ characters opens the demo.</p>
    <form id="login-form" novalidate>
      <label for="login-email">Email</label>
      <input type="email" id="login-email" name="email" placeholder="you@example.com" autocomplete="email" required aria-describedby="login-email-error">
      <p class="field-error" id="login-email-error"></p>
      <label for="login-password">Password</label>
      <input type="password" id="login-password" name="password" autocomplete="current-password" required aria-describedby="login-password-error">
      <p class="field-error" id="login-password-error"></p>
      <label class="check" for="remember-me"><input type="checkbox" id="remember-me" name="remember"> Remember me</label>
      <p id="login-feedback" role="status"></p>
      <button type="submit" id="login-button">Login</button>
    </form>
    <p class="sep">or</p>
    <button type="button" id="google-login" class="secondary">Sign in with Google</button>
    <p><a href="#" id="forgot-password">Forgot Password?</a></p>
  </section>
</main>
<script src="common.js"></script>
</body>
</html>
